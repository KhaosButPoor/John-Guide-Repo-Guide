<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>John Guide's Repo Guide · Dandy's World</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --topbar-h:68px;
    --bg:#150f1f;
    --ink:#0b0612;
    --surface-1:#1f1731;
    --surface-2:#2a2040;
    --surface-3:#352952;
    --border:#3a2c58;
    --border-strong:#54407e;
    --text:#f8f2fc;
    --text-secondary:#c9bddf;
    --text-muted:#9a8db5;
    --brand:#ff5a9e;
    --brand-deep:#8f2457;
    --support:#b48cf2;
    --support-dim:#2f2447;
    --extracteur:#38d9c9;
    --extracteur-dim:#143a3a;
    --soigneur:#7ee08a;
    --soigneur-dim:#1a3a22;
    --distracteur:#ff8a4c;
    --distracteur-dim:#3d2517;
    --radius:14px;
    --radius-lg:22px;
    --font-display:'Fredoka',sans-serif;
    --font-body:'Figtree',sans-serif;
    --font-mono:'Figtree',sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background-color:var(--bg);
    background-image:radial-gradient(rgba(255,255,255,.045) 1.3px,transparent 1.6px);
    background-size:20px 20px;
    color:var(--text);
    font-family:var(--font-body);
    font-size:16px;
    line-height:1.65;
    min-height:100vh;
  }
  ::selection{background:var(--brand);color:#fff;}
  a{color:var(--brand);}
  :focus-visible{outline:3px solid var(--brand);outline-offset:2px;}

  /* ---------- App shell ---------- */
  .app{display:flex;flex-direction:column;min-height:100vh;}
  header.topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    height:var(--topbar-h);
    padding:0 28px;
    border-bottom:2px solid var(--border);
    background:rgba(21,15,31,.9);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    position:sticky;
    top:0;
    z-index:30;
  }
  .brand{display:flex;align-items:center;gap:14px;font-family:var(--font-display);}
  .brand .mark{
    display:flex;
    align-items:center;
    gap:12px;
    color:var(--text);
    font-size:24px;
    font-weight:700;
    letter-spacing:.2px;
    line-height:1;
  }
  .brand .mark::before{
    content:"★";
    display:grid;
    place-items:center;
    width:34px;height:34px;
    border-radius:11px;
    background:var(--brand);
    color:#fff;
    font-size:17px;
    border:2px solid var(--ink);
    box-shadow:0 3px 0 var(--brand-deep);
    transform:rotate(-7deg);
  }
  .brand .sub{
    color:var(--text-muted);
    font-size:13px;
    font-weight:500;
    font-family:var(--font-body);
    padding-left:14px;
    border-left:2px solid var(--border);
  }
  nav.toplinks{
    display:flex;
    gap:4px;
    background:var(--surface-1);
    border:2px solid var(--border);
    border-radius:999px;
    padding:4px;
  }
  nav.toplinks button{
    font-family:var(--font-display);
    font-weight:600;
    font-size:14px;
    border:none;
    background:transparent;
    color:var(--text-secondary);
    padding:8px 18px;
    border-radius:999px;
    cursor:pointer;
    transition:background .15s ease,color .15s ease;
  }
  nav.toplinks button:hover{color:var(--text);}
  nav.toplinks button.active{
    background:var(--brand);
    color:#fff;
    box-shadow:0 3px 0 var(--brand-deep);
  }

  main{
    flex:1;
    display:flex;
    max-width:1240px;
    width:100%;
    margin:0 auto;
    align-items:flex-start;
  }

  /* ---------- View switching ---------- */
  .view{display:none;width:100%;}
  .view.active{display:flex;width:100%;}
  #view-general{display:none;padding:36px 28px 80px;max-width:920px;margin:0 auto;}
  #view-general.active{display:block;}

  /* ---------- Sidebar ---------- */
  aside.sidebar{
    width:300px;
    flex-shrink:0;
    border-right:2px solid var(--border);
    position:sticky;
    top:var(--topbar-h);
    align-self:flex-start;
    height:calc(100vh - var(--topbar-h));
    display:flex;
    flex-direction:column;
    padding:20px 16px;
    gap:16px;
  }
  .search-wrap{position:relative;}
  #search{
    width:100%;
    padding:12px 14px 12px 40px;
    border-radius:999px;
    border:2px solid var(--border);
    background:var(--surface-1);
    color:var(--text);
    font-family:var(--font-body);
    font-size:15px;
    outline:none;
    transition:border-color .15s ease;
  }
  #search:focus{border-color:var(--brand);}
  #search::placeholder{color:var(--text-muted);}
  .search-wrap svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);opacity:.6;}
  .filters{display:flex;flex-wrap:wrap;gap:7px;}
  .chip{
    font-family:var(--font-body);
    font-size:13px;
    font-weight:700;
    padding:5px 13px;
    border-radius:999px;
    border:2px solid var(--border);
    background:var(--surface-1);
    color:var(--text-secondary);
    cursor:pointer;
    user-select:none;
    transition:border-color .15s ease,color .15s ease;
  }
  .chip:hover{border-color:var(--border-strong);color:var(--text);}
  .chip.active[data-role="Tous"]{background:var(--brand);border-color:var(--brand);color:#fff;}
  .chip.active[data-role="Support"]{background:var(--support-dim);border-color:var(--support);color:var(--support);}
  .chip.active[data-role="Extracteur"]{background:var(--extracteur-dim);border-color:var(--extracteur);color:var(--extracteur);}
  .chip.active[data-role="Soigneur"]{background:var(--soigneur-dim);border-color:var(--soigneur);color:var(--soigneur);}
  .chip.active[data-role="Distracteur"]{background:var(--distracteur-dim);border-color:var(--distracteur);color:var(--distracteur);}

  #toon-list{
    list-style:none;
    margin:0;
    padding:2px 4px 8px 2px;
    overflow-y:auto;
    flex:1;
    display:flex;
    flex-direction:column;
    gap:5px;
  }
  #toon-list li{
    display:flex;
    align-items:center;
    gap:12px;
    padding:10px 12px;
    border-radius:14px;
    border:2px solid transparent;
    cursor:pointer;
    color:var(--text-secondary);
    transition:background .12s ease;
  }
  #toon-list li:hover{background:var(--surface-1);}
  #toon-list li.selected{
    background:var(--surface-2);
    border-color:var(--border-strong);
    color:var(--text);
    box-shadow:0 3px 0 var(--ink);
  }
  #toon-list li .dot{
    width:12px;height:12px;border-radius:50%;flex-shrink:0;
    border:2px solid var(--ink);
  }
  #toon-list li .name{font-family:var(--font-display);font-weight:600;font-size:16px;flex:1;}
  #toon-list li .floor{
    font-size:12px;
    font-weight:700;
    font-variant-numeric:tabular-nums;
    color:var(--text-muted);
    background:var(--surface-3);
    padding:2px 9px;
    border-radius:999px;
  }
  #toon-list li.selected .floor{color:var(--text);}
  .empty-list{color:var(--text-muted);font-size:14px;padding:18px 8px;text-align:center;}

  /* ---------- Detail pane ---------- */
  #detail{flex:1;padding:32px 36px 80px;min-width:0;}
  #detail-content{
    --accent:var(--brand);
    --accent-dim:#4a1c37;
  }
  #detail-content[data-role="Support"]{--accent:var(--support);--accent-dim:var(--support-dim);}
  #detail-content[data-role="Extracteur"]{--accent:var(--extracteur);--accent-dim:var(--extracteur-dim);}
  #detail-content[data-role="Soigneur"]{--accent:var(--soigneur);--accent-dim:var(--soigneur-dim);}
  #detail-content[data-role="Distracteur"]{--accent:var(--distracteur);--accent-dim:var(--distracteur-dim);}

  .detail-header{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:24px;
    flex-wrap:wrap;
    padding:26px 30px;
    background:var(--accent-dim);
    border:2px solid var(--accent);
    border-radius:var(--radius-lg);
    box-shadow:0 6px 0 var(--ink);
  }
  .detail-header h1{
    font-family:var(--font-display);
    font-size:48px;
    font-weight:700;
    line-height:1.05;
    margin:0 0 12px;
  }
  .role-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .role-line span[style]{color:var(--text-secondary)!important;font-size:13px!important;}
  .role-pill{
    font-size:13px;
    font-weight:700;
    padding:4px 13px;
    border-radius:999px;
    border:2px solid currentColor;
  }
  .role-pill.Support{background:var(--support-dim);color:var(--support);}
  .role-pill.Extracteur{background:var(--extracteur-dim);color:var(--extracteur);}
  .role-pill.Soigneur{background:var(--soigneur-dim);color:var(--soigneur);}
  .role-pill.Distracteur{background:var(--distracteur-dim);color:var(--distracteur);}

  .floor-gauge{min-width:230px;flex-shrink:0;}
  .floor-gauge .label{
    display:flex;
    justify-content:space-between;
    gap:12px;
    font-size:13px;
    font-weight:600;
    color:var(--text-secondary);
    margin-bottom:6px;
  }
  .floor-gauge .label span:first-child{white-space:nowrap;}
  .floor-gauge .label span:last-child{
    white-space:nowrap;
    flex-shrink:0;
    color:var(--text);
    font-family:var(--font-display);
    font-size:17px;
    line-height:1;
  }
  .floor-gauge .track{
    height:16px;
    background:var(--ink);
    border:2px solid var(--ink);
    border-radius:999px;
    overflow:hidden;
  }
  .floor-gauge .fill{
    height:100%;
    background:repeating-linear-gradient(-45deg,#ff5a9e 0 7px,#fff0f6 7px 14px);
    border-radius:999px;
  }

  section.block{margin-top:34px;}
  section.block h2,
  #view-general h2{
    font-family:var(--font-display);
    font-weight:600;
    font-size:22px;
    color:var(--text);
    margin:0 0 14px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  section.block h2::before,
  #view-general h2::before{
    content:"";
    width:12px;height:12px;
    background:var(--accent,var(--brand));
    border:2px solid var(--ink);
    border-radius:4px;
    transform:rotate(45deg);
    flex-shrink:0;
  }
  .cap-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .cap-card{
    background:var(--surface-1);
    border:2px solid var(--border-strong);
    border-radius:var(--radius-lg);
    padding:18px 20px 20px;
    box-shadow:0 5px 0 var(--ink);
  }
  .cap-card .tag{
    display:inline-block;
    font-family:var(--font-display);
    font-size:14px;
    font-weight:600;
    color:var(--ink);
    background:var(--accent);
    padding:2px 12px;
    border-radius:999px;
    margin-bottom:10px;
  }
  .cap-card p{margin:0;font-size:15px;color:var(--text-secondary);}

  .trinket-list{display:flex;flex-direction:column;gap:8px;}
  .trinket-row{
    display:flex;
    gap:16px;
    background:var(--surface-1);
    border:2px solid var(--border);
    border-radius:var(--radius);
    padding:12px 18px;
    font-size:15px;
    align-items:baseline;
    flex-wrap:wrap;
  }
  .trinket-row .t-label{font-size:13px;font-weight:600;color:var(--text-muted);min-width:220px;}
  .trinket-row .t-combo{color:var(--text);font-weight:700;}

  .inv-box{
    background:var(--surface-1);
    border:2px solid var(--border);
    border-left:6px solid var(--accent);
    border-radius:var(--radius);
    padding:14px 18px;
    font-size:15px;
    color:var(--text-secondary);
  }

  ul.tips{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:11px;}
  ul.tips li{position:relative;padding-left:26px;font-size:15px;color:var(--text-secondary);}
  ul.tips li::before{
    content:"";
    position:absolute;
    left:2px;top:7px;
    width:10px;height:10px;
    border-radius:50%;
    background:var(--accent,var(--brand));
    border:2px solid var(--ink);
  }

  .warn-box{
    background:var(--distracteur-dim);
    border:2px solid #7a4421;
    border-radius:var(--radius);
    padding:14px 18px;
    font-size:15px;
    color:#ffd7b8;
  }
  .panic-box{
    background:var(--surface-2);
    border:2px solid var(--border-strong);
    border-radius:var(--radius);
    padding:14px 18px;
    font-size:15px;
    color:var(--text-secondary);
  }
  .notes-box{
    font-size:14.5px;
    color:var(--text-muted);
    border-top:2px dashed var(--border);
    padding-top:14px;
  }
  .notes-box p{margin:0 0 8px;}

  .placeholder{
    display:flex;align-items:center;justify-content:center;
    height:60vh;color:var(--text-muted);
    font-family:var(--font-display);font-size:18px;text-align:center;padding:0 20px;
  }

  /* ---------- General tab ---------- */
  #view-general h1{
    font-family:var(--font-display);
    font-size:40px;
    font-weight:700;
    line-height:1.1;
    margin:0 0 8px;
  }
  #view-general h2{margin:44px 0 16px;}
  .twisted-card{
    background:var(--surface-1);
    border:2px solid var(--border);
    border-radius:var(--radius);
    padding:14px 18px;
    margin-bottom:10px;
    font-size:15px;
    color:var(--text-secondary);
  }
  .twisted-card b{color:var(--text);font-family:var(--font-display);font-weight:600;font-size:16px;}

  table.speed{width:100%;border-collapse:collapse;font-size:14.5px;font-variant-numeric:tabular-nums;}
  table.speed th{
    text-align:left;
    color:var(--text);
    background:var(--surface-2);
    font-family:var(--font-display);
    font-weight:600;
    font-size:14px;
    padding:11px 14px;
    border-bottom:2px solid var(--border-strong);
  }
  table.speed td{padding:10px 14px;border-bottom:1px solid var(--border);color:var(--text-secondary);}
  table.speed tr:last-child td{border-bottom:none;}
  table.speed td.first{color:var(--text);font-weight:700;}
  .table-wrap{overflow-x:auto;border:2px solid var(--border);border-radius:var(--radius);background:var(--surface-1);}

  .comp-list{display:flex;flex-direction:column;gap:10px;}
  .comp-row{
    background:var(--surface-1);
    border:2px solid var(--border);
    border-radius:var(--radius);
    padding:12px 18px;
    font-size:15px;
    color:var(--text-secondary);
  }
  .comp-row b{color:var(--text);font-family:var(--font-display);font-weight:600;font-size:16px;}

  .closing{
    margin-top:52px;
    padding:22px 24px;
    background:var(--brand);
    border:2px solid var(--ink);
    border-radius:var(--radius-lg);
    box-shadow:0 6px 0 var(--brand-deep);
    font-family:var(--font-display);
    font-size:18px;
    font-weight:600;
    color:#fff;
    text-align:center;
  }

  /* ---------- Mobile ---------- */
  .menu-btn{
    display:none;
    background:var(--surface-1);
    border:2px solid var(--border-strong);
    color:var(--text);
    border-radius:12px;
    width:40px;height:40px;
    align-items:center;justify-content:center;
    cursor:pointer;
  }
  .back-btn{
    display:none;
    font-family:var(--font-body);
    font-size:14px;
    font-weight:700;
    color:var(--text-secondary);
    background:var(--surface-1);
    border:2px solid var(--border-strong);
    border-radius:999px;
    padding:7px 14px;
    cursor:pointer;
    margin-bottom:18px;
    align-items:center;
    gap:6px;
  }

  @media (max-width: 820px){
    :root{--topbar-h:60px;}
    header.topbar{padding:0 14px;}
    .brand .sub{display:none;}
    .brand .mark{font-size:18px;gap:9px;}
    .brand .mark::before{width:28px;height:28px;font-size:14px;border-radius:9px;}
    nav.toplinks button{padding:7px 12px;font-size:13px;}
    main{display:block;}
    aside.sidebar{
      position:fixed;
      top:0;left:0;
      height:100vh;
      width:82%;
      max-width:330px;
      background:var(--bg);
      z-index:50;
      transform:translateX(-105%);
      transition:transform .2s ease;
      box-shadow:2px 0 24px rgba(0,0,0,.6);
    }
    aside.sidebar.open{transform:translateX(0);}
    .menu-btn{display:flex;}
    .sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;}
    .sidebar-overlay.open{display:block;}
    #detail{padding:20px 16px 64px;}
    .back-btn{display:inline-flex;}
    .cap-grid{grid-template-columns:1fr;}
    .detail-header{padding:20px;}
    .detail-header h1{font-size:34px;}
    .floor-gauge{min-width:100%;}
    #view-general{padding:24px 16px 64px;}
    #view-general h1{font-size:30px;}
    .trinket-row{flex-direction:column;gap:2px;}
    .trinket-row .t-label{min-width:auto;}
  }
  @media (prefers-reduced-motion: reduce){
    *{transition:none!important;}
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div style="display:flex;align-items:center;gap:12px;">
      <button class="menu-btn" id="menuBtn" aria-label="Ouvrir la liste des toons">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="brand">
        <span class="mark">John Guide's Repo Guide</span>
        <span class="sub">Dandy's World · Guide des Toons</span>
      </div>
    </div>
    <nav class="toplinks">
      <button id="tab-toons" class="active">Toons</button>
      <button id="tab-general">Conseils généraux</button>
    </nav>
  </header>

  <main>
    <div id="view-toons" class="view active" style="display:flex;">
      <div class="sidebar-overlay" id="overlay"></div>
      <aside class="sidebar" id="sidebar">
        <div class="search-wrap">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input id="search" type="text" placeholder="Rechercher un toon..." autocomplete="off">
        </div>
        <div class="filters" id="filters">
          <span class="chip active" data-role="Tous">Tous</span>
          <span class="chip" data-role="Support">Support</span>
          <span class="chip" data-role="Extracteur">Extracteur</span>
          <span class="chip" data-role="Soigneur">Soigneur</span>
          <span class="chip" data-role="Distracteur">Distracteur</span>
        </div>
        <ul id="toon-list"></ul>
      </aside>
      <div id="detail">
        <button class="back-btn" id="backBtn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
          Tous les toons
        </button>
        <div id="detail-content"></div>
      </div>
    </div>

    <div id="view-general" class="view"></div>
  </main>
</div>

<script>
const ROLE_COLOR = {
  Support: "var(--support)",
  Extracteur: "var(--extracteur)",
  Soigneur: "var(--soigneur)",
  Distracteur: "var(--distracteur)"
};
const MAX_FLOOR = 116;

const toons = [
{
  id:"bobette", name:"Bobette", roles:["Support"], roleLabel:"Support",
  floor:116, floorPlus:false,
  passive:"Un anneau entoure Bobette. Les alliés à l'intérieur gagnent de la vitesse et une régénération d'endurance indéfiniment. Quand ils sortent de l'anneau, le boost persiste encore 5 secondes.",
  active:"Bobette devient invincible et invisible pendant 8 secondes mais ne peut pas bouger. Temps de recharge : 90 secondes. Son anneau reste actif pendant ce temps.",
  trinkets:[
    {label:"Support du distracteur (runs standard / sérieuses)", value:"Diary + Toy Kit"},
    {label:"Support du distracteur (duo confiant)", value:"Diary + Magnifying Glass"},
    {label:"Rôle extracteur", value:"Veemote + Magnifying Glass"}
  ],
  trinketNote:"Dans les runs sérieuses sur floors élevés, toujours privilégier la première combinaison.",
  inventory:"Soin, Soin, + 1 slot situationnel. Avant le floor de Dyle : emporter une Valve si vous en trouvez une. Après le floor de Dyle ou sans Valve : la Box of Chocolates est un bon choix. Vous pouvez aussi laisser le slot vide pour faire des achats en boutique.",
  gameplay:[
    "Solar Distracting : toujours marcher dans le sens opposé au distracteur. Si le distracteur tourne à gauche, vous tournez à droite. Si le distracteur vous demande de supporter les autres à la place, adaptez-vous librement.",

/* ---------- Rendering: toon list ---------- */
const listEl = document.getElementById('toon-list');
const searchEl = document.getElementById('search');
const filtersEl = document.getElementById('filters');
let activeFilter = "Tous";
let selectedId = null;

function roleDotColor(roles){ return ROLE_COLOR[roles[0]] || "var(--text-muted)"; }

function renderList(){
  const q = searchEl.value.trim().toLowerCase();
  const filtered = toons.filter(t=>{
    const matchesRole = activeFilter === "Tous" || t.roles.includes(activeFilter);
    const matchesSearch = t.name.toLowerCase().includes(q);
    return matchesRole && matchesSearch;
  }).sort((a,b)=>a.name.localeCompare(b.name,'fr'));
  listEl.innerHTML = "";
  if(filtered.length === 0){
    const li = document.createElement('div');
    li.className = "empty-list";
    li.textContent = "Aucun toon ne correspond.";
    listEl.appendChild(li);
    return;
  }
  filtered.forEach(t=>{
    const li = document.createElement('li');
    li.dataset.id = t.id;
    if(t.id === selectedId) li.classList.add('selected');
    li.innerHTML = `<span class="dot" style="background:${roleDotColor(t.roles)}"></span><span class="name">${t.name}</span><span class="floor">F${t.floor}${t.floorPlus?'+':''}</span>`;
    li.addEventListener('click', ()=>selectToon(t.id));
    listEl.appendChild(li);
  });
}

filtersEl.querySelectorAll('.chip').forEach(chip=>{
  chip.addEventListener('click', ()=>{
    filtersEl.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
    chip.classList.add('active');
    activeFilter = chip.dataset.role;
    renderList();
  });
});
searchEl.addEventListener('input', renderList);

/* ---------- Rendering: detail ---------- */
const detailContent = document.getElementById('detail-content');

function renderDetail(t){
  const rolePills = t.roles.map(r=>`<span class="role-pill ${r}">${r}</span>`).join(" ");
  const plainRoles = t.roles.join(" / ");
  const extraLabel = t.roleLabel !== plainRoles
    ? `<span style="font-size:12px;color:var(--text-muted);font-family:var(--font-body);">${t.roleLabel}</span>`
    : "";
  const pct = Math.round((t.floor / MAX_FLOOR) * 100);
  const trinketsHtml = t.trinkets.map(tr=>`
    <div class="trinket-row"><span class="t-label">${tr.label}</span><span class="t-combo">${tr.value}</span></div>
  `).join("");
  const gameplayHtml = t.gameplay ? `<ul class="tips">${t.gameplay.map(g=>`<li>${g}</li>`).join("")}</ul>` : "";
  const notesHtml = t.notes ? `<div class="notes-box">${t.notes.map(n=>`<p>${n}</p>`).join("")}</div>` : "";
  const trinketNoteHtml = t.trinketNote ? `<div class="warn-box" style="margin-top:8px;">${t.trinketNote}</div>` : "";

  detailContent.dataset.role = t.roles[0];
  detailContent.innerHTML = `
    <div class="detail-header">
      <div>
        <h1>${t.name}</h1>
        <div class="role-line">${rolePills}${extraLabel}</div>
      </div>
      <div class="floor-gauge">
        <div class="label"><span>Floor le plus haut atteint</span><span>${t.floor}${t.floorPlus?'+':''}</span></div>
        <div class="track"><div class="fill" style="width:${pct}%"></div></div>
      </div>
    </div>

    <section class="block">
      <h2>Capacités</h2>
      <div class="cap-grid">
        <div class="cap-card"><span class="tag">Passive</span><p>${t.passive}</p></div>
        <div class="cap-card"><span class="tag">Active</span><p>${t.active}</p></div>
      </div>
    </section>

    <section class="block">
      <h2>Trinkets recommandés</h2>
      <div class="trinket-list">${trinketsHtml}</div>
      ${trinketNoteHtml}
    </section>

    <section class="block">
      <h2>Inventaire</h2>
      <div class="inv-box">${t.inventory}</div>
    </section>

    ${t.gameplay ? `<section class="block"><h2>Gameplay et état d'esprit</h2>${gameplayHtml}</section>` : ""}

    <section class="block">
      <h2>Mode panique</h2>
      <div class="panic-box">${t.panic}</div>
    </section>

    <section class="block">
      <h2>Erreur courante</h2>
      <div class="warn-box">${t.mistake}</div>
    </section>

    ${notesHtml ? `<section class="block"><h2>Notes supplémentaires</h2>${notesHtml}</section>` : ""}
  `;
}

function selectToon(id){
  selectedId = id;
  const t = toons.find(x=>x.id===id);
  if(!t) return;
  renderDetail(t);
  renderList();
  closeSidebarMobile();
  document.getElementById('detail').scrollTo({top:0,behavior:'instant'});
  window.scrollTo({top:0,behavior:'instant'});
}

/* ---------- Mobile sidebar ---------- */
const sidebar = document.getElementById('sidebar');
const overlay = document.getElementById('overlay');
const menuBtn = document.getElementById('menuBtn');
const backBtn = document.getElementById('backBtn');

function openSidebarMobile(){ sidebar.classList.add('open'); overlay.classList.add('open'); }
function closeSidebarMobile(){ sidebar.classList.remove('open'); overlay.classList.remove('open'); }
menuBtn.addEventListener('click', openSidebarMobile);
overlay.addEventListener('click', closeSidebarMobile);
backBtn.addEventListener('click', openSidebarMobile);

/* ---------- Tabs ---------- */
const tabToons = document.getElementById('tab-toons');
const tabGeneral = document.getElementById('tab-general');
const viewToons = document.getElementById('view-toons');
const viewGeneral = document.getElementById('view-general');

tabToons.addEventListener('click', ()=>{
  tabToons.classList.add('active'); tabGeneral.classList.remove('active');
  viewToons.classList.add('active'); viewToons.style.display='flex';
  viewGeneral.classList.remove('active'); viewGeneral.style.display='none';
});
tabGeneral.addEventListener('click', ()=>{
  tabGeneral.classList.add('active'); tabToons.classList.remove('active');
  viewGeneral.classList.add('active'); viewGeneral.style.display='block';
  viewToons.classList.remove('active'); viewToons.style.display='none';
});
